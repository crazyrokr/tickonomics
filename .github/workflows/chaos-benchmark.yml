name: Chaos & Benchmark

on:
  schedule:
    - cron: '3 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos-test:
    name: Chaos Resilience Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: tickonomics_test
          POSTGRES_USER: tickonomics
          POSTGRES_PASSWORD: tickonomics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - uses: actions/cache@v5
        id: talib-native-cache
        with:
          path: native-libs
          key: talib-native-${{ hashFiles('native-libs/ta-lib/VERSION') }}

      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository/com/tictactec
          key: talib-jna-${{ hashFiles('computation/build.gradle') }}

      - name: Build TA-Lib native
        if: steps.talib-native-cache.outputs.cache-hit != 'true'
        run: |
          ./gradlew :computation:cloneTalibNative --no-daemon
          ./gradlew :computation:buildTalibNative --no-daemon

      - name: Run all tests including integration
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tickonomics_test
          SPRING_DATASOURCE_USERNAME: tickonomics
          SPRING_DATASOURCE_PASSWORD: tickonomics
        run: ./gradlew build --no-daemon

      - name: Set up Python
        uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'

      - name: Cache Python venv
        uses: actions/cache@v5
        id: venv-cache
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('analytics/requirements.txt') }}

      - name: Install analytics dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r analytics/requirements.txt

      - name: Put venv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run Python analytics tests
        run: cd analytics && python -m pytest tests -q

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-test-results
          path: '**/build/reports/tests/**'

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: chaos-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'

      - name: Cache Python venv
        uses: actions/cache@v5
        id: venv-cache
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('analytics/requirements.txt') }}

      - name: Install benchmark tooling
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r analytics/requirements.txt

      - name: Put venv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Restore benchmark baseline
        uses: actions/cache@v5
        with:
          path: analytics/.benchmarks
          key: benchmark-baseline-${{ runner.os }}

      - name: Run benchmark regression
        working-directory: analytics
        continue-on-error: true
        run: |
          # --benchmark-compare-fail raises a hard error when no saved baseline exists,
          # so only enable comparison once a baseline is present (first run bootstraps it).
          compare_args=()
          if [ "$(find .benchmarks -name '*.json' 2>/dev/null | wc -l)" -gt 0 ]; then
            compare_args+=(--benchmark-compare --benchmark-compare-fail=mean:10%)
          fi
          python -m pytest tests \
            --benchmark-only \
            --benchmark-storage=.benchmarks \
            --benchmark-autosave \
            "${compare_args[@]}" || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: analytics/.benchmarks/**
