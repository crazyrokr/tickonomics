name: Chaos & Benchmark

on:
  schedule:
    - cron: '3 6 * * 1'
  workflow_dispatch:

jobs:
  chaos-test:
    name: Chaos Resilience Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: tickonomics_test
          POSTGRES_USER: tickonomics
          POSTGRES_PASSWORD: tickonomics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - uses: actions/cache@v4
        id: talib-cache
        with:
          path: native-libs
          key: talib-${{ hashFiles('native-libs/ta-lib/VERSION') }}

      - name: Build TA-Lib native
        if: steps.talib-cache.outputs.cache-hit != 'true'
        run: |
          ./gradlew :computation:cloneTalibNative --no-daemon
          ./gradlew :computation:buildTalibNative --no-daemon

      - name: Run all tests including integration
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tickonomics_test
          SPRING_DATASOURCE_USERNAME: tickonomics
          SPRING_DATASOURCE_PASSWORD: tickonomics
        run: ./gradlew build --no-daemon

      - name: Run Python analytics tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - run: |
          pip install -r analytics/requirements.txt
          cd analytics && python -m pytest tests -q

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-test-results
          path: '**/build/reports/tests/**'

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: chaos-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run benchmark
        run: echo "Benchmark placeholder — add JMH or custom benchmarks in integration-tests module"
