name: Chaos & Benchmark

on:
  schedule:
    - cron: '3 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos-test:
    name: Chaos Resilience Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: tickonomics_test
          POSTGRES_USER: tickonomics
          POSTGRES_PASSWORD: tickonomics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Shares pr-checks' TA-Lib cache entries: same runner arch and the same
      # pinned wrapper artifact. The old per-workflow keys (talib-jna-*, and
      # talib-native-<hash of a gitignored VERSION file> which degenerated to
      # an empty hash) never resolved the mavenLocal wrapper JAR. Restore-only:
      # pr-checks' java-build-test is the single saver of both keys.
      - uses: actions/cache/restore@v6
        id: talib-native-cache
        with:
          path: native-libs
          key: talib-native-x86_64-${{ hashFiles('computation/build.gradle') }}

      - uses: actions/cache/restore@v6
        id: talib-wrapper-cache
        with:
          path: ~/.m2/repository/com/tictactec
          key: talib-wrapper-${{ hashFiles('computation/build.gradle') }}

      - name: Build & install TA-Lib (native + FFM jar)
        if: steps.talib-native-cache.outputs.cache-hit != 'true' || steps.talib-wrapper-cache.outputs.cache-hit != 'true'
        run: ./gradlew :computation:setupTalib --no-daemon

      - name: Run all tests including integration
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tickonomics_test
          SPRING_DATASOURCE_USERNAME: tickonomics
          SPRING_DATASOURCE_PASSWORD: tickonomics
        run: ./gradlew build --no-daemon

      - name: Set up Python
        uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'

      - name: Cache Python venv
        uses: actions/cache@v6
        id: venv-cache
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('analytics/requirements.txt') }}

      - name: Install analytics dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r analytics/requirements.txt

      - name: Put venv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run Python analytics tests
        run: cd analytics && python -m pytest tests -q

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-test-results
          path: '**/build/reports/tests/**'

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: chaos-test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'

      - name: Cache Python venv
        uses: actions/cache@v6
        id: venv-cache
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('analytics/requirements.txt') }}

      - name: Install benchmark tooling
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r analytics/requirements.txt

      - name: Put venv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Restore benchmark baseline
        uses: actions/cache@v6
        with:
          path: analytics/.benchmarks
          key: benchmark-baseline-${{ runner.os }}

      # continue-on-error (not `|| true`): a regression or collection failure
      # stays visible as an orange step with its full log instead of vanishing
      # and surfacing later only as an empty-artifact upload warning.
      - name: Run benchmark regression
        working-directory: analytics
        continue-on-error: true
        run: |
          # --benchmark-compare-fail raises a hard error when no saved baseline exists,
          # so only enable comparison once a baseline is present (first run bootstraps it).
          compare_args=()
          if [ "$(find .benchmarks -name '*.json' 2>/dev/null | wc -l)" -gt 0 ]; then
            compare_args+=(--benchmark-compare --benchmark-compare-fail=mean:10%)
          fi
          python -m pytest tests \
            --benchmark-only \
            --benchmark-storage=.benchmarks \
            --benchmark-autosave \
            "${compare_args[@]}"

      # Fails the job when no results were saved at all (a silent pytest
      # failure upstream). A comparison *regression* still saves results, so
      # a legitimate >10% slowdown keeps this step green.
      - name: Check benchmark results saved
        run: |
          SAVED=$(find analytics/.benchmarks -name '*.json' 2>/dev/null)
          if [ -z "$SAVED" ]; then
            echo "::error::No benchmark results saved — see the 'Run benchmark regression' log above"
            exit 1
          fi
          echo "Saved benchmark results:"
          echo "$SAVED"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: analytics/.benchmarks/**
