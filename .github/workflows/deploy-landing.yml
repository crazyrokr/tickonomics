name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Landing Page
    runs-on: ubuntu-latest
    environment: landing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        working-directory: landing
        run: npm ci

      - name: Lint
        working-directory: landing
        run: npm run lint

      - name: Type check
        working-directory: landing
        run: npm run typecheck

      - name: Build
        working-directory: landing
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.LANDING_API_URL || 'http://localhost:8080' }}

      - name: Run tests
        working-directory: landing
        run: npm test

      - name: Deploy to Vercel
        if: vars.VERCEL_PROJECT_ID
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: landing
          vercel-args: '--prod'

      - name: Deploy via Docker (fallback)
        if: vars.DEPLOY_SSH_KEY && !vars.VERCEL_PROJECT_ID
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LANDING_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/tickonomics
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build landing

      - name: Invalidate CDN cache
        if: vars.CDN_DISTRIBUTION_ID
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CDN_DISTRIBUTION_ID }} \
            --paths "/api/demo/*" "/api/health"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
