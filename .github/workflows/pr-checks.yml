name: PR Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-build-test:
    name: Java 25 Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - uses: actions/cache@v6
        id: talib-native-cache
        with:
          path: native-libs
          key: talib-native-x86_64-${{ hashFiles('computation/build.gradle') }}

      # The FFM wrapper jar is pure Java (arch-neutral), so both Java jobs
      # share one cache key; only the native .so build is per-arch.
      # java-build-test is the single saver of both keys: a second concurrent
      # saver loses the post-step reservation and logs 'Failed to save:
      # Unable to reserve cache ...', so the other jobs restore-only.
      - uses: actions/cache@v6
        id: talib-wrapper-cache
        with:
          path: ~/.m2/repository/com/tictactec
          key: talib-wrapper-${{ hashFiles('computation/build.gradle') }}

      - name: Build & install TA-Lib (native + FFM jar)
        if: steps.talib-wrapper-cache.outputs.cache-hit != 'true'
        run: ./gradlew :computation:setupTalib

      - name: Download OpenTelemetry agent
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opentelemetry-javaagent.jar" \
            https://repo1.maven.org/maven2/io/opentelemetry/javaagent/opentelemetry-javaagent/2.28.1/opentelemetry-javaagent-2.28.1.jar

      - name: Build & Test (except integration-tests)
        env:
          JAVA_TOOL_OPTIONS: "-javaagent:${{ runner.temp }}/opentelemetry-javaagent.jar"
          OTEL_TRACES_EXPORTER: "none"
          OTEL_METRICS_EXPORTER: "none"
          OTEL_LOGS_EXPORTER: "none"
        run: ./gradlew build -x :integration-tests:test

      - name: Generate jacoco and aggregated coverage reports
        run: ./gradlew jacocoTestReport :test-coverage:testCodeCoverageReport -x test -x :integration-tests:test

      # The PR number is the only metadata carried here: the default
      # pull_request checkout is shallow, so a git diff against the base SHA
      # fails ('Invalid symmetric difference expression'). Changed-file
      # detection lives in coverage-report.yml, which uses the PR files API.
      - name: Save PR metadata
        if: always()
        run: |
          mkdir -p pr-metadata
          echo "${{ github.event.number }}" > pr-metadata/pr-number

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-metadata
          path: pr-metadata/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-reports
          path: '**/build/reports/jacoco/**'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: java-test-results
          path: '**/build/reports/tests/**'

  java-build-test-arm64:
    name: Java 25 Build & Test (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - uses: actions/cache@v6
        id: talib-native-cache-arm
        with:
          path: native-libs
          key: talib-native-aarch64-${{ hashFiles('computation/build.gradle') }}

      # Restore-only: the x86 java-build-test job is the single saver of the
      # shared wrapper key (the .so above is per-arch, so this job saves that
      # key as usual under its own talib-native-aarch64-* entry).
      - uses: actions/cache/restore@v6
        id: talib-wrapper-cache-arm
        with:
          path: ~/.m2/repository/com/tictactec
          key: talib-wrapper-${{ hashFiles('computation/build.gradle') }}

      - name: Build & install TA-Lib (native + FFM jar)
        if: steps.talib-wrapper-cache-arm.outputs.cache-hit != 'true'
        run: ./gradlew :computation:setupTalib

      - name: Build & Test (except integration-tests)
        run: ./gradlew build -x :integration-tests:test

      - name: Generate jacoco and aggregated coverage reports
        run: ./gradlew jacocoTestReport :test-coverage:testCodeCoverageReport -x test -x :integration-tests:test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: java-test-results-arm64
          path: '**/build/reports/tests/**'

  python-test:
    name: Python 3.12 Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'

      # Same key as chaos-benchmark.yml, so the venv is shared across workflows.
      - name: Cache Python venv
        uses: actions/cache@v6
        id: venv-cache
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('analytics/requirements.txt') }}

      - name: Install analytics dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r analytics/requirements.txt

      - name: Put venv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff, advisory)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check analytics/

      - name: Run pytest
        working-directory: analytics
        run: python -m pytest tests -m "not benchmark" --junitxml=build/test-results/pytest/results.xml -q

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-test-results
          path: analytics/build/test-results/**

  frontend-build-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [landing, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - uses: actions/cache@v6
        with:
          path: ${{ matrix.app }}/.next/cache
          key: nextjs-${{ matrix.app }}-${{ hashFiles(format('{0}/package-lock.json', matrix.app)) }}
          restore-keys: nextjs-${{ matrix.app }}-

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run lint

      - name: Type check
        working-directory: ${{ matrix.app }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

      - name: Test
        working-directory: ${{ matrix.app }}
        run: npm test

      - name: Run Lighthouse CI
        if: matrix.app == 'landing'
        working-directory: landing
        continue-on-error: true
        run: |
          npm install -g @lhci/cli
          lhci autorun --config=${{ github.workspace }}/.github/lighthouse/lighthouserc.js || true

  code-quality:
    name: Static Analysis (Advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Same action/key as java-build-test, so this job restores its dependency
      # cache instead of re-downloading (and gains configuration-cache support).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      # The FFM wrapper jar resolves from mavenLocal, which the ~/.gradle cache
      # above does not cover — same pattern as java-build-test. Restore-only
      # (no post-step save): java-build-test is the single saver of both keys,
      # so a save here would race with it ('Unable to reserve cache').
      - uses: actions/cache/restore@v6
        id: talib-native-cache
        with:
          path: native-libs
          key: talib-native-x86_64-${{ hashFiles('computation/build.gradle') }}

      - uses: actions/cache/restore@v6
        id: talib-wrapper-cache
        with:
          path: ~/.m2/repository/com/tictactec
          key: talib-wrapper-${{ hashFiles('computation/build.gradle') }}

      - name: Build & install TA-Lib (native + FFM jar)
        if: steps.talib-wrapper-cache.outputs.cache-hit != 'true'
        run: ./gradlew :computation:setupTalib

      - name: Run Checkstyle + SpotBugs
        continue-on-error: true
        run: ./gradlew lint

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            **/build/reports/checkstyle/**
            **/build/reports/spotbugs/**
