name: PR Checks

on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-build-test:
    name: Java 25 Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - uses: actions/cache@v4
        id: talib-native-cache
        with:
          path: native-libs
          key: talib-native-${{ hashFiles('native-libs/ta-lib/VERSION') }}

      - uses: actions/cache@v4
        id: talib-jna-cache
        with:
          path: ~/.m2/repository/com/tictactec
          key: talib-jna-${{ hashFiles('computation/build.gradle') }}

      - name: Build & install TA-Lib (native + JNA jar)
        if: steps.talib-jna-cache.outputs.cache-hit != 'true'
        run: ./gradlew :computation:setupTalib --no-daemon

      - name: Download OpenTelemetry agent
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opentelemetry-javaagent.jar" \
            https://repo1.maven.org/maven2/io/opentelemetry/javaagent/opentelemetry-javaagent/2.28.1/opentelemetry-javaagent-2.28.1.jar

      - name: Build & Test (except integration-tests)
        env:
          JAVA_TOOL_OPTIONS: "-javaagent:${{ runner.temp }}/opentelemetry-javaagent.jar"
          OTEL_TRACES_EXPORTER: "none"
          OTEL_METRICS_EXPORTER: "none"
          OTEL_LOGS_EXPORTER: "none"
        run: ./gradlew build -x :integration-tests:test --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-results
          path: '**/build/reports/tests/**'

  python-test:
    name: Python 3.12 Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r analytics/requirements.txt

      - name: Lint (ruff, advisory)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check analytics/

      - name: Run pytest
        working-directory: analytics
        run: python -m pytest tests -m "not benchmark" --junitxml=build/test-results/pytest/results.xml -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: analytics/build/test-results/**

  frontend-build-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [landing, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ${{ matrix.app }}/.next/cache
          key: nextjs-${{ matrix.app }}-${{ hashFiles(format('{0}/package-lock.json', matrix.app)) }}
          restore-keys: nextjs-${{ matrix.app }}-

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run lint

      - name: Type check
        working-directory: ${{ matrix.app }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

      - name: Test
        working-directory: ${{ matrix.app }}
        run: npm test

      - name: Run Lighthouse CI
        if: matrix.app == 'landing'
        working-directory: landing
        continue-on-error: true
        run: |
          npm install -g @lhci/cli
          lhci autorun --config=${{ github.workspace }}/.github/lighthouse/lighthouserc.js || true

  code-quality:
    name: Static Analysis (Advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cq-${{ hashFiles('**/*.gradle') }}
          restore-keys: gradle-cq-

      - name: Run Checkstyle + SpotBugs
        continue-on-error: true
        run: ./gradlew lint --no-daemon

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/checkstyle/**
            **/build/reports/spotbugs/**
