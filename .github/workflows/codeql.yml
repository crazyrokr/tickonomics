name: CodeQL Weekly

on:
  push:
    branches: [main]
    paths:
      - 'api-contracts/**'
      - 'cdm/**'
      - 'ingestion/**'
      - 'computation/**'
      - 'persistence/**'
      - 'web/**'
      - 'app/**'
      - 'analytics/**'
      - 'frontend/**'
      - 'landing/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      # The Java build needs the project toolchain and a Gradle dependency
      # cache, so the matrix-wide job only pays for it in the java entry.
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      # mavenLocal gap: :computation:compileClasspath resolves the TA-Lib FFM
      # wrapper from ~/.m2, which the setup-gradle cache above does not cover
      # (autobuild then fails to store the configuration cache). Restore-only:
      # pr-checks' java-build-test is the single saver of both keys.
      - if: matrix.language == 'java-kotlin'
        uses: actions/cache/restore@v6
        id: talib-native-cache
        with:
          path: native-libs
          key: talib-native-x86_64-${{ hashFiles('computation/build.gradle') }}

      - if: matrix.language == 'java-kotlin'
        uses: actions/cache/restore@v6
        id: talib-wrapper-cache
        with:
          path: ~/.m2/repository/com/tictactec
          key: talib-wrapper-${{ hashFiles('computation/build.gradle') }}

      - name: Build & install TA-Lib (native + FFM jar)
        if: matrix.language == 'java-kotlin' && (steps.talib-native-cache.outputs.cache-hit != 'true' || steps.talib-wrapper-cache.outputs.cache-hit != 'true')
        run: ./gradlew :computation:setupTalib --no-daemon

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
