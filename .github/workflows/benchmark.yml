name: Benchmark Service

on:
  pull_request:
    paths:
      - 'computation/**'
      - 'analytics/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Performance Benchmark Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.12'

      - name: Cache Python venv
        uses: actions/cache@v4
        id: venv-cache
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('analytics/requirements.txt') }}

      - name: Install dependencies and benchmark tooling
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r analytics/requirements.txt

      - name: Put venv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Restore benchmark baseline
        uses: actions/cache@v4
        with:
          path: analytics/.benchmarks
          key: benchmark-baseline-${{ runner.os }}

      - name: Run benchmark regression
        working-directory: analytics
        continue-on-error: true
        run: |
          set -o pipefail
          # --benchmark-compare-fail raises a hard error when no saved baseline exists,
          # so only enable comparison once a baseline is present (first run bootstraps it).
          compare_args=""
          if [ "$(find .benchmarks -name '*.json' 2>/dev/null | wc -l)" -gt 0 ]; then
            compare_args="--benchmark-compare --benchmark-compare-fail=mean:10%"
          fi
          python -m pytest tests \
            --benchmark-only \
            --benchmark-storage=.benchmarks \
            --benchmark-autosave \
            $compare_args \
            2>&1 | tee benchmark-output.txt || true

      - name: Publish benchmark report
        if: always()
        run: |
          {
            echo "<!-- benchmark-report -->"
            echo "## Benchmark Regression Report"
            echo ""
            echo "Engine: pytest-benchmark (cached-baseline, >10% mean regression gate)."
            echo ""
            cat analytics/benchmark-output.txt 2>/dev/null || echo "_No benchmark output captured._"
          } > benchmark-report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Find this bot's prior benchmark report (matched by the hidden marker in the
          # report body) and update it in place, so repeated runs don't pile up comments.
          comment_id=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- benchmark-report -->")) | .id' \
            | tail -n 1)

          if [ -n "$comment_id" ]; then
            gh pr comment "$PR_NUMBER" --edit "$comment_id" --body-file benchmark-report.md
          else
            gh pr comment "$PR_NUMBER" --body-file benchmark-report.md
          fi

      - name: Deferred benchmark capabilities
        run: |
          echo "Java JMH benchmark tasks (backtestBenchmark, regulatoryScenarioTest) and the"
          echo "compare_benchmarks.py / rds_check.py helper scripts are deferred to Tracks 5/8."
          echo "See docs/adr/ADR-016-cicd-pipeline-finalization.md."
