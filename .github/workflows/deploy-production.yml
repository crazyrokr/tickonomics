name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - uses: actions/cache@v4
        id: talib-cache
        with:
          path: native-libs
          key: talib-${{ hashFiles('native-libs/ta-lib/VERSION') }}

      - name: Build TA-Lib native
        if: steps.talib-cache.outputs.cache-hit != 'true'
        run: |
          ./gradlew :computation:cloneTalibNative --no-daemon
          ./gradlew :computation:buildTalibNative --no-daemon

      - name: Build & Test
        run: ./gradlew build -x :integration-tests:test --no-daemon

      - name: Build Spring Boot JAR
        run: ./gradlew :app:bootJar --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: app/build/libs/*.jar

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy production environment
        run: echo "Production deployment placeholder — requires Track 11 Docker infrastructure"
        env:
          DEPLOY_ENV: production

  verify:
    name: Verify Deployment
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: echo "Production verification placeholder — check health endpoints"
