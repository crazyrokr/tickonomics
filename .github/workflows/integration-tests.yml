name: Integration Tests

on:
  pull_request:
    branches: [main, test]

# Distinct concurrency group: GitHub shares concurrency groups across workflows,
# so reusing pr-checks' "pr-<ref>" group would let these two workflows cancel
# each other mid-run.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# This workflow is intentionally separate from pr-checks.yml because its
# integration-test job declares a `services:` container. The local `act -n`
# dry-run (see ADR-026 / ADR-027) panics on service containers in act 0.2.89
# (nektos/act PR #5782 is unmerged), so service-bearing jobs must stay out of
# the dry-run gate workflows (pr-checks.yml, benchmark.yml).
jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: tickonomics_test
          POSTGRES_USER: tickonomics
          POSTGRES_PASSWORD: tickonomics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - uses: actions/cache@v4
        id: talib-native-cache
        with:
          path: native-libs
          key: talib-native-${{ hashFiles('native-libs/ta-lib/VERSION') }}

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/tictactec
          key: talib-jna-${{ hashFiles('computation/build.gradle') }}

      - name: Build TA-Lib native
        if: steps.talib-native-cache.outputs.cache-hit != 'true'
        run: |
          ./gradlew :computation:cloneTalibNative --no-daemon
          ./gradlew :computation:buildTalibNative --no-daemon

      - name: Run integration tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tickonomics_test
          SPRING_DATASOURCE_USERNAME: tickonomics
          SPRING_DATASOURCE_PASSWORD: tickonomics
        run: ./gradlew :integration-tests:test --no-daemon
