name: Integration Tests

on:
  pull_request:

permissions:
  contents: read

# Distinct concurrency group: GitHub shares concurrency groups across workflows,
# so reusing pr-checks' "pr-<ref>" group would let these two workflows cancel
# each other mid-run.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# This workflow is intentionally separate from pr-checks.yml because its
# integration-test job declares a `services:` container. The local `act -n`
# dry-run (see ADR-026 / ADR-027) panics on service containers in act 0.2.89
# (nektos/act PR #5782 is unmerged), so service-bearing jobs must stay out of
# the dry-run gate workflows (pr-checks.yml, benchmark.yml).
jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: tickonomics_test
          POSTGRES_USER: tickonomics
          POSTGRES_PASSWORD: tickonomics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - uses: actions/cache/restore@v6
        id: talib-native-cache
        with:
          path: native-libs
          key: talib-native-x86_64-${{ hashFiles('computation/build.gradle') }}

      # Shares pr-checks' cache entries: the runner is x86_64 and the wrapper
      # jar is pure Java, so both keys are identical there. Restore-only
      # (no save): pr-checks' java-build-test is the single saver of both keys
      # and runs on the same pull_request event — a save here would race
      # across the two workflows.
      - uses: actions/cache/restore@v6
        id: talib-wrapper-cache
        with:
          path: ~/.m2/repository/com/tictactec
          key: talib-wrapper-${{ hashFiles('computation/build.gradle') }}

      - name: Build & install TA-Lib (native + FFM jar)
        if: steps.talib-wrapper-cache.outputs.cache-hit != 'true'
        run: ./gradlew :computation:setupTalib --no-daemon

      - name: Run integration tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tickonomics_test
          SPRING_DATASOURCE_USERNAME: tickonomics
          SPRING_DATASOURCE_PASSWORD: tickonomics
        run: ./gradlew :integration-tests:test --no-daemon
