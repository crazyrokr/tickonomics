name: Demo Report

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: demo-report
  cancel-in-progress: false

jobs:
  generate-report:
    name: Generate Weekly Demo Report
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      issues: write
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: tickonomics
          POSTGRES_USER: tickonomics
          POSTGRES_PASSWORD: tickonomics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Query demo metrics
        env:
          DEMO_DB_URL: ${{ secrets.DEMO_DB_URL || 'jdbc:postgresql://localhost:5432/tickonomics' }}
          DEMO_DB_USER: tickonomics
          DEMO_DB_PASS: tickonomics
        run: |
          # Query P&L summary
          PNL=$(psql "$DEMO_DB_URL" -U "$DEMO_DB_USER" -t -Ac \
            "SELECT COALESCE(ROUND(SUM(realized_pnl)::numeric, 2), 0) FROM virtual_portfolio_trades WHERE executed_at > NOW() - INTERVAL '7 days'" 2>/dev/null || echo "0")
          
          # Query signal count
          SIGNAL_COUNT=$(psql "$DEMO_DB_URL" -U "$DEMO_DB_USER" -t -Ac \
            "SELECT COUNT(*) FROM signal_log WHERE time > NOW() - INTERVAL '7 days'" 2>/dev/null || echo "0")
          
          # Query hit rate
          HIT_RATE=$(psql "$DEMO_DB_URL" -U "$DEMO_DB_USER" -t -Ac \
            "SELECT COALESCE(ROUND(AVG(CASE WHEN realized_pnl > 0 THEN 1.0 ELSE 0.0 END)::numeric * 100, 1), 0) FROM virtual_portfolio_trades WHERE executed_at > NOW() - INTERVAL '7 days'" 2>/dev/null || echo "0")
          
          # Query active positions
          POSITIONS=$(psql "$DEMO_DB_URL" -U "$DEMO_DB_USER" -t -Ac \
            "SELECT COUNT(*) FROM virtual_portfolio_positions WHERE closed_at IS NULL" 2>/dev/null || echo "0")

          printf "## Demo Report - %s\n\n### P&L Summary\n- Weekly P&L: **%s**\n- Signals generated (7d): **%s**\n- Hit rate: **%s%%**\n- Open positions: **%s**\n" \
            "$(date -u +%Y-%m-%d)" "$PNL" "$SIGNAL_COUNT" "$HIT_RATE" "$POSITIONS" > report.md

          printf "\n---\n_Generated by demo-report workflow_\n" >> report.md

          cat report.md

      - name: Verify demo criteria
        id: criteria
        run: |
          # Check if all demo readiness criteria are met
          CRITERIA_MET=true

          # Extract values from report
          HIT_RATE=$(grep "Hit rate" report.md | grep -oP '\d+\.\d+' || echo "0")
          SIGNAL_COUNT=$(grep "Signals generated" report.md | grep -oP '\d+' || echo "0")

          if (( $(echo "$HIT_RATE < 50.0" | bc -l) )); then
            echo "::warning::Hit rate $HIT_RATE% below 50% threshold"
            CRITERIA_MET=false
          fi

          if [ "$SIGNAL_COUNT" -lt 10 ]; then
            echo "::warning::Signal count $SIGNAL_COUNT below minimum 10"
            CRITERIA_MET=false
          fi

          echo "criteria_met=$CRITERIA_MET" >> "$GITHUB_OUTPUT"

      - name: Create report issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            const criteriaMet = '${{ steps.criteria.outputs.criteria_met }}' === 'true';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Demo Report - ${new Date().toISOString().split('T')[0]}`,
              body: report,
              labels: ['demo-report']
            });

            if (criteriaMet) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Demo Ready for Live Evaluation',
                body: 'All demo readiness criteria have been met. Ready for live evaluation.',
                labels: ['demo-ready']
              });
            }
