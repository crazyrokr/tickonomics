name: Deploy Staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image namespace
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push analytics worker image
        uses: docker/build-push-action@v5
        with:
          context: ./analytics
          file: ./analytics/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-analytics:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-analytics:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-dashboard:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push landing image
        uses: docker/build-push-action@v5
        with:
          context: ./landing
          file: ./landing/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-landing:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-landing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run Flyway Migrations
    needs: build-and-push
    if: ${{ vars.ENABLE_STAGING_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Flyway migrations
        run: |
          docker run --rm \
            -v "$PWD/persistence/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:10-alpine \
            -url="${{ secrets.STAGING_DB_URL }}" \
            -user="${{ secrets.STAGING_DB_USER }}" \
            -password="${{ secrets.STAGING_DB_PASS }}" \
            -connectRetries=60 \
            -locations=filesystem:/flyway/sql \
            migrate

  deploy:
    name: Deploy to Staging
    needs: [build-and-push, migrate]
    if: ${{ always() && needs.build-and-push.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && vars.ENABLE_STAGING_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image namespace
        run: |
          echo "IMAGE_PREFIX=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: REGISTRY,IMAGE_PREFIX,IMAGE_TAG
          script: |
            cd /opt/tickonomics
            echo "$GHCR_TOKEN" | docker login $REGISTRY -u "$GHCR_USER" --password-stdin
            export TAG=$IMAGE_TAG
            export REGISTRY
            export IMAGE_PREFIX
            export BACKEND_IMAGE="$REGISTRY/$IMAGE_PREFIX-backend:$TAG"
            export ANALYTICS_IMAGE="$REGISTRY/$IMAGE_PREFIX-analytics:$TAG"
            export DASHBOARD_IMAGE="$REGISTRY/$IMAGE_PREFIX-dashboard:$TAG"
            export LANDING_IMAGE="$REGISTRY/$IMAGE_PREFIX-landing:$TAG"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --force-recreate \
              backend analytics-worker dashboard landing
            docker image prune -f

  smoke-test:
    name: Smoke Tests
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify health endpoint
        run: |
          BASE="${{ vars.STAGING_API_URL || 'http://localhost:8080' }}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/actuator/health" || echo "000")
            if [ "$CODE" = "200" ]; then echo "Health check passed (HTTP 200)"; exit 0; fi
            echo "  [$i/30] health=$CODE, retrying..."
            sleep 2
          done
          echo "::error::Staging health check failed after 60s"
          exit 1

      - name: Verify ingestion + continuous aggregates
        run: |
          BASE="${{ vars.STAGING_API_URL || 'http://localhost:8080' }}"
          curl -fs "$BASE/actuator/health/liveness" >/dev/null && echo "Liveness OK"
          curl -fs "$BASE/actuator/health/readiness" >/dev/null && echo "Readiness OK"

  deploy-demo:
    name: Update Demo Environment
    needs: build-and-push
    if: ${{ always() && needs.build-and-push.result == 'success' && vars.ENABLE_DEMO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image namespace
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Restart demo paper trading engine
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEMO_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          envs: IMAGE_PREFIX,IMAGE_TAG
          script: |
            cd /opt/tickonomics
            export TAG=$IMAGE_TAG
            docker compose -f docker-compose.yml -f docker-compose.demo.yml pull backend analytics-worker
            docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --no-deps --force-recreate backend analytics-worker

  notify:
    name: Notify Team
    needs: [deploy, smoke-test, deploy-demo]
    if: ${{ always() && vars.ENABLE_STAGING_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post deployment notification
        continue-on-error: true
        run: |
          STATUS="${{ needs.deploy.result == 'success' && needs.smoke-test.result == 'success' && 'success' || 'failed' }}"
          curl -fsSL -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"Staging deploy $STATUS for ${{ github.sha }} (run ${{ github.run_id }})\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true
