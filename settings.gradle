plugins {
    id 'com.gradle.develocity' version '4.6.1'
}

develocity {
    buildScan {
        termsOfUseUrl = "https://gradle.com/help/legal-terms-of-use"
        termsOfUseAgree = "yes"
        publishing.onlyIf { System.getenv('CI') == 'true' }
    }
}

rootProject.name = 'tickonomics'

include 'api-contracts'
include 'cdm'
include 'ingestion'
include 'computation'
include 'persistence'
include 'web'
include 'app'
include 'integration-tests'
include 'test-coverage'
include 'analytics'
