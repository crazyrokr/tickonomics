spring:
  application:
    name: tickonomics
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 60s
  datasource:
    url: jdbc:postgresql://localhost:5432/tickonomics
    username: tickonomics
    password: tickonomics
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    execute-in-transaction: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: tickonomics-dashboard
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/oauth2/jwks}

security:
  auth-disabled: ${AUTH_DISABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

analytics:
  worker:
    url: http://localhost:8001

server:
  port: 8080
  shutdown: graceful

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4317

guard:
  evict-interval-ms: 3600000

monitor:
  ingestion:
    lkg-cache:
      max-staleness-seconds: 3600
  demo:
    enabled: false
    virtual-balance: 100000
    position-size-pct: 5
    stop-loss-pct: 5
    take-profit-pct: 10
    auto-execute-signals: false
    execute-degraded-signals: true
    skip-dislocated-signals: true
    default-addv: 10000000

  equity-price:
    enabled: true
    poll-interval-ms: 21600000
    symbols: SPY,QQQ,IWM,TLT,HYG,GLD

  yahoo-finance:
    enabled: true
    base-url: https://query1.finance.yahoo.com
    connect-timeout: 5s
    read-timeout: 30s

  finnhub:
    api-key: ${FINNHUB_API_KEY:}
    rest-enabled: true
    rest-url: https://finnhub.io/api/v1
    ws-enabled: true
    ws-url: wss://ws.finnhub.io
    ws-reconnect-backoff-max: 60s
    symbols: SPY,QQQ,IWM,TLT,HYG,GLD
    news-enabled: true
    connect-timeout: 5s
    read-timeout: 30s

  news:
    enabled: true
    poll-interval-ms: 21600000

  fed-rss:
    enabled: true
    speeches-url: https://www.federalreserve.gov/feeds/speeches.xml
    fomc-url: https://www.federalreserve.gov/feeds/press_monetary.xml
    poll-interval-ms: 3600000

  ken-french:
    enabled: true
    base-url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp
    poll-interval-ms: 86400000

  yield-curve:
    enabled: true

  alpha-vantage:
    enabled: true
    api-key: ${ALPHAVANTAGE_API_KEY:}
    base-url: https://www.alphavantage.co/query
    poll-interval-ms: 86400000
    symbols: SPY,QQQ,IWM,TLT,HYG,GLD
    commodities: GOLD,OIL,NATURAL_GAS,COPPER
    rate-limit-delay-ms: 12100
    initial-full-load: true

  datahub:
    enabled: true
    base-url: https://datahub.io
    startup-full-load: true
    incremental-check-cron: "0 0 2 1 * *"

resilience4j:
  retry:
    instances:
      fredApi:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.RestClientException
      nyfedApi:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.RestClientException
      yahooFinanceApi:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.RestClientException
      finnhubApi:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.RestClientException
      fedRssApi:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.RestClientException
      alphaVantageApi:
        max-attempts: 3
        wait-duration: 12s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.RestClientException
      analyticsWorker:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.RestClientException
  bulkhead:
    instances:
      criticalIngestion:
        max-concurrent-calls: 4
      highVolumeIngestion:
        max-concurrent-calls: 16
      computationEngine:
        max-concurrent-calls: 8
