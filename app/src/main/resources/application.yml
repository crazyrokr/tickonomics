spring:
  application:
    name: tickonomics
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/tickonomics
    username: tickonomics
    password: tickonomics
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration

analytics:
  worker:
    url: http://localhost:8001

server:
  port: 8080
