spring:
  application:
    name: tickonomics
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/tickonomics
    username: tickonomics
    password: tickonomics
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration

analytics:
  worker:
    url: http://localhost:8001

server:
  port: 8080

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4317

guard:
  evict-interval-ms: 3600000

monitor:
  ingestion:
    lkg-cache:
      max-staleness-seconds: 3600
  demo:
    enabled: false
    virtual-balance: 100000
    position-size-pct: 5
    stop-loss-pct: 5
    take-profit-pct: 10
    auto-execute-signals: false
    execute-degraded-signals: true
    skip-dislocated-signals: true
    default-addv: 10000000

resilience4j:
  retry:
    instances:
      fredApi:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.RestClientException
      nyfedApi:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.RestClientException
      analyticsWorker:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.RestClientException
  bulkhead:
    instances:
      criticalIngestion:
        max-concurrent-calls: 4
      highVolumeIngestion:
        max-concurrent-calls: 16
      computationEngine:
        max-concurrent-calls: 8
