plugins {
    id 'java-library'
}

// --- TA-Lib native + JNA build configuration ---
// One-time setup: ./gradlew :computation:setupTalib
// This clones, builds, and installs TA-Lib native + JNA wrapper into Maven local.
// After setup, normal ./gradlew build works.
def nativeBuildDir = layout.projectDirectory.dir("${rootProject.projectDir}/native-libs")
def talibNativeDir = nativeBuildDir.dir('ta-lib')
def talibJnaDir = nativeBuildDir.dir('ta-lib-jna')
def talibJnaVersion = '0.6.4-20251203.1'
def generatedNativeResources = layout.buildDirectory.dir('generated-resources/native')

tasks.register('cloneTalibNative') {
    outputs.dir(talibNativeDir)
    doLast {
        if (!talibNativeDir.dir('.git').asFile.exists()) {
            new ProcessBuilder('git', 'clone', 'https://github.com/TA-Lib/ta-lib.git', talibNativeDir.asFile.absolutePath)
                    .inheritIO().start().waitFor()
        }
    }
}

tasks.register('buildTalibNative') {
    dependsOn cloneTalibNative
    outputs.file(talibNativeDir.file('build/libta-lib.so'))
    doLast {
        def buildDir = talibNativeDir.dir('build').asFile
        buildDir.mkdirs()
        new ProcessBuilder('cmake', '..').directory(buildDir).inheritIO().start().waitFor()
        new ProcessBuilder('make', "-j${Runtime.runtime.availableProcessors()}").directory(buildDir).inheritIO().start().waitFor()
    }
}

tasks.register('cloneTalibJna') {
    outputs.dir(talibJnaDir)
    doLast {
        if (!talibJnaDir.dir('.git').asFile.exists()) {
            new ProcessBuilder('git', 'clone', 'https://github.com/tuxmonteiro/ta-lib-jna.git', talibJnaDir.asFile.absolutePath)
                    .inheritIO().start().waitFor()
        }
    }
}

tasks.register('buildTalibJna') {
    dependsOn buildTalibNative, cloneTalibJna
    def jnaJar = providers.systemProperty('user.home').map { home ->
        "${home}/.m2/repository/com/tictactec/ta/lib/ta-lib-jna/${talibJnaVersion}/ta-lib-jna-${talibJnaVersion}.jar"
    }
    outputs.file(jnaJar)
    doLast {
        def pb = new ProcessBuilder('mvn', 'clean', 'install', '-q')
                .directory(talibJnaDir.asFile)
                .inheritIO()
        pb.environment().put('LD_LIBRARY_PATH', talibNativeDir.dir('build').asFile.absolutePath)
        def exitCode = pb.start().waitFor()
        if (exitCode != 0) {
            throw new GradleException("mvn install failed with exit code ${exitCode}")
        }
    }
}

tasks.register('copyTalibNative', Copy) {
    dependsOn buildTalibNative
    from(talibNativeDir.file('build/libta-lib.so'))
    into generatedNativeResources
}

tasks.register('setupTalib') {
    dependsOn buildTalibJna, copyTalibNative
    group = 'Setup'
    description = 'One-time setup: builds TA-Lib native C library and JNA wrapper, installs JAR to Maven local'
}

tasks.named('processResources').configure {
    dependsOn copyTalibNative
}

sourceSets {
    main {
        resources {
            srcDir generatedNativeResources
        }
    }
}

tasks.withType(Test).configureEach {
    jvmArgs "-Djna.library.path=${talibNativeDir.dir('build').asFile.absolutePath}"
}

// --- Dependencies ---
dependencies {
    api project(':cdm')
    implementation project(':persistence')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation "com.tictactec.ta.lib:ta-lib-jna:${talibJnaVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
}
