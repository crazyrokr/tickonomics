plugins {
  id 'java'
  id 'io.spring.dependency-management' version '1.1.7' apply false
  id 'org.springframework.boot' version '3.5.0' apply false
  id 'com.github.spotbugs' version '6.5.6' apply false
}

allprojects {
  repositories {
    mavenLocal()
    mavenCentral()
  }
}

subprojects {
  apply plugin: 'java'
  apply plugin: 'groovy'
  apply plugin: 'checkstyle'
  apply plugin: 'com.github.spotbugs'
  apply plugin: 'io.spring.dependency-management'

  group = 'io.tickonomics'
  version = '0.0.1-SNAPSHOT'

  dependencyManagement {
    imports {
      mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.0"
      mavenBom "org.spockframework:spock-bom:2.4-groovy-4.0"
    }
    dependencies {
      dependency 'org.apache.groovy:groovy:4.0.29'
    }
  }

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(25)
    }
  }

  tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
  }

  dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.apache.groovy:groovy'
  }

  tasks.named('test') {
    useJUnitPlatform()
  }

  checkstyle {
    ignoreFailures = true
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
  }

  spotbugs {
    ignoreFailures = true
  }

  tasks.named('spotbugsMain').configure {
    reports {
      xml.required = true
      html.required = true
    }
  }

  tasks.register('lint') {
    group = 'verification'
    description = 'Advisory static analysis: Checkstyle + SpotBugs (never fails the build).'
    dependsOn tasks.named('checkstyleMain'), tasks.named('checkstyleTest'),
             tasks.named('spotbugsMain'), tasks.named('spotbugsTest')
  }
}

tasks.register('lint') {
  group = 'verification'
  description = 'Aggregates advisory static analysis across all modules.'
  dependsOn subprojects.collect { it.tasks.named('lint') }
}
