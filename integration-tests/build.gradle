plugins {
  id 'java'
}

tasks.named('test') {
  useJUnitPlatform()
  // The FFM wrapper resolves libta-lib.so via System.loadLibrary (see TalibNativeLoader),
  // so the test JVM needs the same flags as :computation:test.
  jvmArgs "--enable-native-access=ALL-UNNAMED",
      "-Djava.library.path=${rootProject.projectDir}/native-libs/ta-lib/build",
      "--add-opens", "java.base/java.nio=ALL-UNNAMED",
      "--add-opens", "java.base/sun.nio.ch=ALL-UNNAMED"
}

dependencies {
  implementation project(':app')
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-web'
  testImplementation 'org.testcontainers:testcontainers-postgresql'
  testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}
